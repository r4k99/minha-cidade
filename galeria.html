<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/galeria.css">
    <title>Tóquio - A Cidade dos Sonhos</title>
</head>
<body>
    <header>
        <figure id="icone">
            <img src="imagens/icone.png" class="icone"
                alt="Ícone redondo escrito 'tokyo'. No fundo das letras há desenhos de alguns prédios, simbolizando a cidade urbana.">
            <div id="toquio-icone">
                <figcaption>TÓQUIO</figcaption>
            </div>
        </figure>
    
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Galeria de Imagens</h1>
        <h2>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</h2>

        <section class="galeria">
            <figure>
                <img src="imagens/shibuya-foto.jpg"
                    alt="Foto do cruzamento mais movimentado de Tóquio. No centro da cidade, com vários prédios e uma forte presença de telas com luzes fortes. Muitas pessoas o atravessam.">
            </figure>
            <figure>
                <img src="imagens/templo-foto.jpg"
                    alt="Templo Sensoji. Arquitetura japones, com tetos largos e pontudos. No fundo, há outro templo bem iluminado. Em volta, há algumas sakuras.">
            </figure>
            <figure>
                <img src="imagens/tower-foto.jpg"
                    alt="Tokyo Tower em uma noite de céu limpo. A torre, alta e conforme a altura se afina, se encontra bem iluminada. Há alguns prédios em volta.">
            </figure>
            <figure>
                <img src="imagens/akihabara-foto.jpg"
                    alt="Foto do grande centro da cultura japonesa. São exibidos vários edifícios com posters iluminados de jogos, mangás e animes.">
            </figure>
            <figure>
                <img src="imagens/gyoen-foto.jpg"
                    alt="Grande parque da capital japonesa. Na foto, encontra-se um lago, cercado por vegetação, incluindo as sakuras. Ao fundo, há um edifício, semelhante a uma torre.">
            </figure>
            <figure>
                <img src="imagens/centro.jpg"
                    alt="Foto do grande centro da cultura japonesa. São exibidos vários edifícios com posters iluminados de jogos, mangás e animes. Está de noite e há algumas pessoas caminhando sobre a rua.">
            </figure>
            <figure>
                <img src="imagens/cidadeVistaDeCima.jpg"
                    alt="Tóquio visto de cima. No fundo, há uma montanha com o topo coberto de neve e a Tokyo Tower">
            </figure>
            <figure>
                <img src="imagens/sakuras.jpg"
                    alt="Foto de um riacho no Japão, com sakuras em volta.">
            </figure>
            <figure>
                <img src="imagens/temploGaleria.jpg"
                    alt="Templo japonês iluminado.">
            </figure>
            <figure>
                <img src="imagens/toquioNoOutono.jpg"
                    alt="Rio em um parque japonês, como árvores ao seu redor. A foto situa-se na estação do outono.">
            </figure>
        </section>
    </main>
    <footer id="contatos">
        <p>"Minha Cidade" - Tóquio</p>
        <br>
        <p>Raquel Lukasevicius - 2026 - 11 912345678</p>
    </footer>
</body>
</html>
